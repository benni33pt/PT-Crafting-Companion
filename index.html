<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwidam Village Workshop Companion</title>
    <style>
        :root {
            --bg-color: #1a1625;
            --card-bg: #282236;
            --accent-gold: #e2b047;
            --accent-purple: #7a52b3;
            --accent-blue: #54b2db;
            --accent-green: #48bb78;
            --text-light: #f0ecf7;
            --border-radius: 12px;
            --bar-height: 54px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            padding-bottom: calc(var(--bar-height) + 40px);
        }

        /* Top Navigation Tabs */
        .nav-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-color);
            border-bottom: 2px solid var(--accent-purple);
            display: flex;
            justify-content: flex-start;
            padding: 10px 12px;
            gap: 8px;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .nav-header::-webkit-scrollbar { display: none; }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--accent-purple);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-gold);
            color: #1a1625;
            border-color: var(--accent-gold);
        }

        .tab-content {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }

        .tab-content.active { display: block; }

        h1 {
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Sub Navigation Toggle */
        .sub-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .sub-btn {
            background: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--accent-purple);
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .sub-btn.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
        }

        /* Item Grid Layout */
        .furniture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #3d3450;
        }

        .item-card.pet-card { border-color: rgba(72, 187, 120, 0.4); }

        .card-img-container {
            text-align: center;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 8px;
        }

        .item-preview-img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
        }

        .index-preview-img {
            max-width: 100%;
            height: 140px;
            object-fit: contain;
        }

        .item-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .item-time {
            font-size: 0.8rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }

        .item-mats {
            font-size: 0.75rem;
            color: #bfaecf;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 4px;
        }

        .btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .qty-input {
            width: 40px;
            text-align: center;
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }

        .generate-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--accent-gold);
            color: #1a1625;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            margin-top: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(226, 176, 71, 0.2);
        }

        /* CHECKLIST STYLING & COLLAPSIBLE SECTIONS */
        .checklist-section {
            margin-bottom: 16px;
            background: rgba(40, 34, 54, 0.4);
            padding: 12px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(63, 53, 88, 0.5);
            transition: all 0.3s ease;
        }

        .checklist-header {
            color: var(--accent-gold);
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            padding-bottom: 4px;
        }

        .checklist-header::after {
            content: "▼";
            font-size: 0.8rem;
            transition: transform 0.2s ease;
        }

        .checklist-section.collapsed .checklist-header::after {
            transform: rotate(-90deg);
        }

        .checklist-content {
            margin-top: 12px;
            border-top: 2px solid var(--accent-purple);
            padding-top: 12px;
        }

        .checklist-section.collapsed .checklist-content {
            display: none;
        }

        .check-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #3d3450;
            cursor: pointer;
            user-select: none;
        }

        .check-item.completed {
            background: rgba(40, 34, 54, 0.6);
            border-color: rgba(63, 53, 88, 0.4);
        }

        .check-item.completed .check-text {
            text-decoration: line-through;
            color: #8e839e;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 2px solid var(--accent-purple);
            border-radius: 6px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
        }

        .check-item.completed .checkbox {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .check-item.completed .checkbox::after {
            content: "✓";
            color: #1a1625;
            font-weight: bold;
            font-size: 1rem;
        }

        .check-text {
            font-size: 0.95rem;
            flex-grow: 1;
            font-weight: 500;
            color: var(--text-light);
        }

        .check-qty {
            color: var(--accent-blue);
            font-weight: bold;
            font-size: 1rem;
            padding: 4px 10px;
            background: rgba(84, 178, 219, 0.15);
            border-radius: 6px;
            margin-left: 12px;
        }

        .check-item.completed .check-qty { opacity: 0.5; }

        .empty-state {
            text-align: center;
            color: #8e839e;
            padding: 40px 20px;
            font-style: italic;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px dashed var(--accent-purple);
        }

        /* FLOATING BOTTOM SHEET */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #201a2d;
            border-top: 2px solid var(--accent-gold);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(calc(100% - var(--bar-height)));
        }

        .bottom-sheet.open { transform: translateY(0); }

        .sheet-header {
            height: var(--bar-height);
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .drag-handle {
            width: 36px;
            height: 4px;
            background-color: #4a4466;
            border-radius: 2px;
            margin: 0 auto 6px;
        }

        .summary-bar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-badge {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: bold;
        }

        .toggle-btn {
            font-size: 0.8rem;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .sheet-body {
            padding: 0 16px 20px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .sheet-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3450;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .sheet-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-light);
        }

        .reset-link {
            font-size: 0.75rem;
            color: #d9534f;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .mat-tile {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tile-title { font-size: 0.75rem; color: #bfaecf; }
        .tile-count { font-size: 0.9rem; font-weight: bold; color: var(--accent-gold); }

        /* Index Grids */
        .index-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .glossary-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px;
            border: 1px solid #3d3450;
        }

        .glossary-title { color: var(--accent-gold); font-size: 1rem; font-weight: bold; margin-bottom: 4px; }
        .glossary-sub { font-size: 0.8rem; color: var(--accent-blue); margin-bottom: 8px; }
        .glossary-lore { font-size: 0.8rem; color: #d0c8e0; font-style: italic; margin-bottom: 10px; line-height: 1.35; }
        .glossary-source { font-size: 0.75rem; color: #bfaecf; background: rgba(63, 53, 88, 0.4); padding: 4px 8px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="nav-header">
        <button class="tab-btn active" onclick="switchTab('calculatorTab', this)">Calculator</button>
        <button class="tab-btn" id="navChecklist" onclick="switchTab('checklistTab', this)">Active Checklist</button>
        <button class="tab-btn" onclick="switchTab('furnitureIndexTab', this)">Furniture Index</button>
        <button class="tab-btn" onclick="switchTab('indexTab', this)">Material Index</button>
    </div>

    <!-- TAB 1: CALCULATOR -->
    <div id="calculatorTab" class="tab-content active">
        <h1>Gwidam Workshop Planner</h1>
        
        <div class="sub-nav">
            <button class="sub-btn active" id="btnCategoryFurniture" onclick="switchCategory('furniture')">Furniture</button>
            <button class="sub-btn" id="btnCategoryPets" onclick="switchCategory('pets')">Pets</button>
        </div>

        <div class="furniture-grid" id="furnitureGrid"></div>
        <button class="generate-btn" onclick="generateChecklist()">Start Project (Create Checklist)</button>
    </div>

    <!-- TAB 2: CHECKLIST -->
    <div id="checklistTab" class="tab-content">
        <h1>Project Checklist</h1>
        <div id="checklistContainer">
            <div class="empty-state">No active project. Select items in the Calculator and click "Start Project" to generate your checklist.</div>
        </div>
    </div>

    <!-- TAB 3: FURNITURE INDEX -->
    <div id="furnitureIndexTab" class="tab-content">
        <h1>Furniture Catalog & Lore</h1>
        <div class="index-grid" id="furnitureIndexGrid"></div>
    </div>

    <!-- TAB 4: MATERIAL INDEX -->
    <div id="indexTab" class="tab-content">
        <h1>Material Glossary & Locations</h1>
        <div class="index-grid" id="indexGrid"></div>
    </div>

    <!-- EXPANDABLE BOTTOM SHEET OVERLAY -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-header" onclick="toggleSheet()">
            <div class="drag-handle"></div>
            <div class="summary-bar-content">
                <span class="time-badge" id="totalTimeDisplay">⏱️ 0m | 0 Items</span>
                <span class="toggle-btn" id="toggleLabel">Materials ▲</span>
            </div>
        </div>
        <div class="sheet-body">
            <div class="sheet-action-row">
                <span class="sheet-title">Required Materials</span>
                <button class="reset-link" onclick="resetQuantities()">Reset Quantities</button>
            </div>
            <div class="materials-grid" id="materialsGrid">
                <div class="mat-tile">
                    <span class="tile-title">Select Items</span>
                    <span class="tile-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ITEMS DATA ARRAY
        const items = [
            { id: "traditional_jar", name: "Traditional Jar", timeMinutes: 3, mats: { "Clay": 3, "Water": 2 }, lore: "A sturdy clay jar crafted using age-old pottery methods.", image: "Traditional Jar.png", category: "furniture" },
            { id: "wooden_stool", name: "Wooden Stool", timeMinutes: 5, mats: { "Wood": 4, "Nails": 2 }, lore: "Simple seating that brings rustic charm to any corner.", image: "Wooden Stool.png", category: "furniture" },
            { id: "village_guardian_monument", name: "Village Guardian Monument", timeMinutes: 15, mats: { "Stone": 10, "Spirit Thread": 3 }, lore: "A stone carving placed to ward off malevolent spirits.", image: "Village Guardian Monument.png", category: "furniture" },
            { id: "haechi_statue", name: "Haechi Statue", timeMinutes: 30, mats: { "Stone": 20, "Gold Ore": 2, "Spirit Thread": 5 }, lore: "A mythical creature believed to protect from fire and disaster.", image: "Haechi Statue.png", category: "furniture" },
            { id: "moonlight_hatched_cottage", name: "Moonlight Hatched Cottage", timeMinutes: 60, mats: { "Wood": 35, "Clay": 15, "Ivory Cube": 2, "Will-o'-the-Wisp": 3 }, lore: "A cozy cottage illuminated by gentle moonlight glows.", image: "Moonlight Hatched Cottage.png", category: "furniture" },
            { id: "calico_cat", name: "Calico Cat", timeMinutes: 30, mats: { "Cat Food": 5, "Soft Fabric": 3, "Common Egg": 1 }, lore: "A friendly, tricolor feline companion.", image: "calico_cat.png", category: "pets" },
            { id: "divine_beast", name: "Divine Beast", timeMinutes: 120, mats: { "Divine Beast Supplement": 1, "Divine Beast Egg": 1, "Spirit Thread": 10 }, lore: "A powerful mythical beast imbued with spiritual energy.", image: "divine_beast.png", category: "pets" }
        ];

        // GLOSSARY DATA ARRAY
        const glossary = [
            { id: "clay", name: "Clay", category: "Excavation", source: "Excavation sites along riverbanks", lore: "Malleable earth used in ceramics and construction." },
            { id: "water", name: "Water", category: "Gathering", source: "Wells and natural streams", lore: "Pure water required for crafting and mixing." },
            { id: "wood", name: "Wood", category: "Gathering", source: "Trees in surrounding forests", lore: "Versatile lumber suitable for all types of furniture." },
            { id: "nails", name: "Nails", category: "Mega Mart", source: "Purchased at Mega Mart", lore: "Iron fasteners required for woodworking." },
            { id: "stone", name: "Stone", category: "Mining", source: "Quarries and rocky outcrops", lore: "Durable stone blocks for sturdy construction." },
            { id: "spirit_thread", name: "Spirit Thread", category: "Events", source: "Special event quests and encounters", lore: "Ethereal thread woven with spiritual energy." },
            { id: "gold_ore", name: "Gold Ore", category: "Mining", source: "Deep underground mining veins", lore: "Rare ore with a brilliant luster." },
            { id: "ivory_cube", name: "Ivory Cube", category: "Furniture Shop", source: "Furniture Shop", lore: "A polished block of ivory used as a structural foundation for advanced dwellings." },
            { id: "will_o_the_wisp", name: "Will-o'-the-Wisp", category: "Catching (Net)", source: "Captured during night hours using a net", lore: "A glowing orb of spiritual flame." },
            { id: "cat_food", name: "Cat Food", category: "Mega Mart", source: "Purchased at Mega Mart", lore: "A tasty treat cats adore." },
            { id: "soft_fabric", name: "Soft Fabric", category: "Gathering", source: "Woven from gathered plant fibers", lore: "Gentle cloth used for bedding and crafts." },
            { id: "common_egg", name: "Common Egg", category: "Gathering", source: "Found in wild nests", lore: "A standard egg capable of hatching small creatures." },
            { id: "divine_beast_supplement", name: "Divine Beast Supplement", category: "Mega Mart", source: "Purchased at Mega Mart", lore: "Nutritious formula required for mythical pets." },
            { id: "divine_beast_egg", name: "Divine Beast Egg", category: "Events", source: "Rare drop during divine event quests", lore: "A radiant egg pulsating with ancient energy." }
        ];

        // STATE MANAGEMENT
        let targetQuantities = JSON.parse(localStorage.getItem('gwidam_workshop_quantities')) || {};
        let checklistState = JSON.parse(localStorage.getItem('gwidam_workshop_checklist')) || {};
        let currentCategory = 'furniture';

        // SANITIZE STRINGS FOR SAFE DOM IDs
        function sanitizeId(str) {
            return str.replace(/[^a-zA-Z0-9]/g, '_');
        }

        // TAB NAVIGATION
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.getElementById('btnCategoryFurniture').classList.toggle('active', cat === 'furniture');
            document.getElementById('btnCategoryPets').classList.toggle('active', cat === 'pets');
            renderGrid();
        }

        // RENDER CALCULATOR GRID
        function renderGrid() {
            const grid = document.getElementById('furnitureGrid');
            grid.innerHTML = '';

            const filteredItems = items.filter(i => (i.category || 'furniture') === currentCategory);

            filteredItems.forEach(item => {
                const qty = targetQuantities[item.id] || 0;
                const matList = Object.entries(item.mats).map(([m, c]) => `${c} ${m}`).join(', ');

                const card = document.createElement('div');
                card.className = `item-card ${item.category === 'pets' ? 'pet-card' : ''}`;
                card.innerHTML = `
                    <div>
                        <div class="card-img-container">
                            <img src="${item.image}" class="item-preview-img" alt="${item.name}" onerror="this.src='placeholder.png'">
                        </div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-time">⏱️ ${item.timeMinutes} mins</div>
                        <div class="item-mats">Req: ${matList}</div>
                    </div>
                    <div class="controls">
                        <button class="btn" onclick="updateQty('${item.id}', -1)">-</button>
                        <input type="text" class="qty-input" value="${qty}" readonly>
                        <button class="btn" onclick="updateQty('${item.id}', 1)">+</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // QUANTITY CONTROLS
        function updateQty(id, delta) {
            targetQuantities[id] = Math.max(0, (targetQuantities[id] || 0) + delta);
            if (targetQuantities[id] === 0) delete targetQuantities[id];
            
            localStorage.setItem('gwidam_workshop_quantities', JSON.stringify(targetQuantities));
            renderGrid();
            calculateTotals();
        }

        function resetQuantities() {
            targetQuantities = {};
            checklistState = {};
            localStorage.removeItem('gwidam_workshop_quantities');
            localStorage.removeItem('gwidam_workshop_checklist');
            renderGrid();
            calculateTotals();
            renderChecklist();
        }

        // PARALLEL TIME CALCULATION (4 SLOTS)
        function calculateParallelTime(durations, maxSlots = 4) {
            if (durations.length === 0) return 0;
            durations.sort((a, b) => b - a);
            let slots = new Array(maxSlots).fill(0);
            durations.forEach(d => {
                let minIndex = slots.indexOf(Math.min(...slots));
                slots[minIndex] += d;
            });
            return Math.max(...slots);
        }

        // CALCULATE TOTALS WITH DYNAMIC SUBTRACTION
        function calculateTotals() {
            let totalTargets = {};
            let remainingMats = {};
            let totalItems = 0;
            let buildDurations = [];

            // 1. Calculate base target requirements
            for (const [id, qty] of Object.entries(targetQuantities)) {
                const item = items.find(i => i.id === id);
                if (!item || qty <= 0) continue;

                totalItems += qty;
                for (let i = 0; i < qty; i++) buildDurations.push(item.timeMinutes);

                for (const [mat, count] of Object.entries(item.mats)) {
                    totalTargets[mat] = (totalTargets[mat] || 0) + (count * qty);
                    remainingMats[mat] = (remainingMats[mat] || 0) + (count * qty);
                }
            }

            // 2. Subtract recipe costs for items checked off as completed
            for (const [checkKey, isCompleted] of Object.entries(checklistState)) {
                if (!isCompleted) continue;
                
                // Extract base item ID
                const baseId = checkKey.substring(0, checkKey.lastIndexOf('_'));
                const item = items.find(i => i.id === baseId);

                // If it's a crafted item, subtract its recipe from the remaining materials
                if (item) {
                    for (const [mat, count] of Object.entries(item.mats)) {
                        remainingMats[mat] = Math.max(0, (remainingMats[mat] || 0) - count);
                    }
                }
            }

            // Update UI elements
            const totalMins = calculateParallelTime(buildDurations, 4);
            const hrs = Math.floor(totalMins / 60);
            const mins = totalMins % 60;
            const timeStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
            
            document.getElementById('totalTimeDisplay').innerText = `⏱️ ${timeStr} | ${totalItems} Target Items`;

            const matGrid = document.getElementById('materialsGrid');
            matGrid.innerHTML = '';

            if (Object.keys(totalTargets).length === 0) {
                matGrid.innerHTML = `<div class="mat-tile"><span class="tile-title">Select Items</span><span class="tile-count">0</span></div>`;
                return;
            }

            for (const [mat, targetCount] of Object.entries(totalTargets)) {
                const currentCount = remainingMats[mat];
                const tile = document.createElement('div');
                tile.className = 'mat-tile';
                tile.innerHTML = `
                    <span class="tile-title">${mat}</span>
                    <span class="tile-count" style="${currentCount === 0 ? 'color: #8e839e; text-decoration: line-through;' : ''}">${currentCount} / ${targetCount}</span>
                `;
                matGrid.appendChild(tile);
            }
        }

        // GENERATE CHECKLIST
        function generateChecklist() {
            renderChecklist();
            switchTab('checklistTab', document.getElementById('navChecklist'));
        }

        // RENDER CHECKLIST WITH SPLIT QUEUES & AUTO-COLLAPSE
        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';

            let hasItems = false;
            let categories = {};

            // Group materials into categories
            for (const [id, qty] of Object.entries(targetQuantities)) {
                const item = items.find(i => i.id === id);
                if (!item || qty <= 0) continue;
                hasItems = true;

                for (const [mat, count] of Object.entries(item.mats)) {
                    const info = glossary.find(g => g.name === mat) || { category: "General" };
                    const cat = info.category;
                    if (!categories[cat]) categories[cat] = {};
                    categories[cat][mat] = (categories[cat][mat] || 0) + (count * qty);
                }
            }

            if (!hasItems) {
                container.innerHTML = `<div class="empty-state">No active project. Select items in the Calculator and click "Start Project" to generate your checklist.</div>`;
                return;
            }

            // 1. Render Material Gathering Categories
            for (const [catName, mats] of Object.entries(categories)) {
                const section = document.createElement('div');
                section.className = 'checklist-section';
                
                let itemsHtml = '';
                for (const [mat, qty] of Object.entries(mats)) {
                    const checkId = `mat_${sanitizeId(mat)}`;
                    const isChecked = checklistState[checkId] || false;
                    itemsHtml += `
                        <div class="check-item ${isChecked ? 'completed' : ''}" onclick="toggleCheck('${checkId}')">
                            <div class="checkbox"></div>
                            <span class="check-text">${mat}</span>
                            <span class="check-qty">x${qty}</span>
                        </div>
                    `;
                }

                section.innerHTML = `
                    <div class="checklist-header" onclick="toggleSection(this)">
                        <span>${catName}</span>
                    </div>
                    <div class="checklist-content">${itemsHtml}</div>
                `;
                container.appendChild(section);
            }

            // 2. Render Furniture Assembly Queue
            let furnitureHtml = '';
            for (const [id, qty] of Object.entries(targetQuantities)) {
                const item = items.find(i => i.id === id && (i.category || 'furniture') === 'furniture');
                if (!item) continue;

                for (let i = 1; i <= qty; i++) {
                    const checkId = `${id}_${i}`;
                    const isChecked = checklistState[checkId] || false;
                    furnitureHtml += `
                        <div class="check-item ${isChecked ? 'completed' : ''}" onclick="toggleCheck('${checkId}')">
                            <div class="checkbox"></div>
                            <span class="check-text">${item.name} #${i}</span>
                            <span class="check-qty">⏱️ ${item.timeMinutes}m</span>
                        </div>
                    `;
                }
            }

            if (furnitureHtml) {
                const fSection = document.createElement('div');
                fSection.className = 'checklist-section';
                fSection.innerHTML = `
                    <div class="checklist-header" onclick="toggleSection(this)">
                        <span>Furniture Assembly</span>
                    </div>
                    <div class="checklist-content">${furnitureHtml}</div>
                `;
                container.appendChild(fSection);
            }

            // 3. Render Pet Hatching Queue
            let petHtml = '';
            for (const [id, qty] of Object.entries(targetQuantities)) {
                const item = items.find(i => i.id === id && i.category === 'pets');
                if (!item) continue;

                for (let i = 1; i <= qty; i++) {
                    const checkId = `${id}_${i}`;
                    const isChecked = checklistState[checkId] || false;
                    petHtml += `
                        <div class="check-item ${isChecked ? 'completed' : ''}" onclick="toggleCheck('${checkId}')">
                            <div class="checkbox"></div>
                            <span class="check-text">${item.name} #${i}</span>
                            <span class="check-qty">⏱️ ${item.timeMinutes}m</span>
                        </div>
                    `;
                }
            }

            if (petHtml) {
                const pSection = document.createElement('div');
                pSection.className = 'checklist-section';
                pSection.innerHTML = `
                    <div class="checklist-header" onclick="toggleSection(this)">
                        <span>Pet Hatching Queue</span>
                    </div>
                    <div class="checklist-content">${petHtml}</div>
                `;
                container.appendChild(pSection);
            }
        }

        // TOGGLE CHECKBOX & AUTO-COLLAPSE
        function toggleCheck(key) {
            checklistState[key] = !checklistState[key];
            localStorage.setItem('gwidam_workshop_checklist', JSON.stringify(checklistState));
            
            calculateTotals();
            renderChecklist();

            // Auto-collapse section if all items checked
            setTimeout(() => {
                document.querySelectorAll('.checklist-section').forEach(sec => {
                    const allItems = sec.querySelectorAll('.check-item');
                    const completedItems = sec.querySelectorAll('.check-item.completed');
                    if (allItems.length > 0 && allItems.length === completedItems.length) {
                        sec.classList.add('collapsed');
                    }
                });
            }, 400);
        }

        function toggleSection(headerEl) {
            headerEl.parentElement.classList.toggle('collapsed');
        }

        // BOTTOM SHEET TOGGLE
        function toggleSheet() {
            const sheet = document.getElementById('bottomSheet');
            const label = document.getElementById('toggleLabel');
            sheet.classList.toggle('open');
            label.innerText = sheet.classList.contains('open') ? 'Materials ▼' : 'Materials ▲';
        }

        // RENDER FURNITURE & MATERIAL INDEXES
        function renderIndexes() {
            const fGrid = document.getElementById('furnitureIndexGrid');
            fGrid.innerHTML = '';
            items.forEach(item => {
                const matList = Object.entries(item.mats).map(([m, c]) => `${c} ${m}`).join(', ');
                fGrid.innerHTML += `
                    <div class="glossary-card">
                        <div class="card-img-container">
                            <img src="${item.image}" class="index-preview-img" alt="${item.name}" onerror="this.src='placeholder.png'">
                        </div>
                        <div class="glossary-title">${item.name}</div>
                        <div class="glossary-sub">Base Time: ${item.timeMinutes} mins</div>
                        <div class="glossary-lore">"${item.lore}"</div>
                        <div class="glossary-source">Recipe: ${matList}</div>
                    </div>
                `;
            });

            const mGrid = document.getElementById('indexGrid');
            mGrid.innerHTML = '';
            glossary.forEach(mat => {
                mGrid.innerHTML += `
                    <div class="glossary-card">
                        <div class="glossary-title">${mat.name}</div>
                        <div class="glossary-sub">Category: ${mat.category}</div>
                        <div class="glossary-lore">"${mat.lore}"</div>
                        <div class="glossary-source">📍 Source: ${mat.source}</div>
                    </div>
                `;
            });
        }

        // INITIALIZE APP
        renderGrid();
        calculateTotals();
        renderChecklist();
        renderIndexes();
    </script>
</body>
</html>

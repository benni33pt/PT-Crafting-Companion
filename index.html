<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwidam Village Workshop Companion</title>
    <style>
        :root {
            --bg-color: #1a1625;
            --card-bg: #282236;
            --accent-purple: #3f3558;
            --text-light: #f0ecf7;
            --accent-gold: #e2b047;
            --accent-blue: #54b2db;
            --accent-pet: #32a873; /* Jade Green for Pets */
            --border-radius: 12px;
            --bar-height: 60px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            padding-bottom: calc(var(--bar-height) + 40px);
        }

        /* Top Navigation Tabs */
        .nav-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-color);
            border-bottom: 2px solid var(--accent-purple);
            display: flex;
            justify-content: flex-start;
            padding: 10px 12px;
            gap: 8px;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .nav-header::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--accent-purple);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-gold);
            color: #1a1625;
            border-color: var(--accent-gold);
        }

        .tab-content {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }

        .tab-content.active {
            display: block;
        }

        h1 {
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Sub-Navigation Toggle for Calculator */
        .sub-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sub-btn {
            background-color: var(--bg-color);
            color: #8e839e;
            border: 2px solid var(--accent-purple);
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-btn.active-furniture {
            background-color: rgba(226, 176, 71, 0.15);
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .sub-btn.active-pets {
            background-color: rgba(50, 168, 115, 0.15);
            color: var(--accent-pet);
            border-color: var(--accent-pet);
        }

        /* Image Styling */
        .card-img-container {
            text-align: center;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 8px;
        }

        .item-preview-img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
        }

        .index-preview-img {
            max-width: 100%;
            height: 140px;
            object-fit: contain;
        }

        /* Calculator Grid Layout */
        .furniture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #3d3450;
            transition: border-color 0.2s ease;
        }

        .item-card.pet-card {
            border: 1px solid rgba(50, 168, 115, 0.4);
        }

        .item-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .pet-card .item-name {
            color: var(--accent-pet);
        }

        .item-time {
            font-size: 0.8rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }

        .item-mats {
            font-size: 0.75rem;
            color: #bfaecf;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 4px;
        }

        .btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .qty-input {
            width: 40px;
            text-align: center;
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }

        /* START PROJECT BUTTON */
        .generate-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--accent-gold);
            color: #1a1625;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            margin-top: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(226, 176, 71, 0.2);
            transition: all 0.2s ease;
        }

        .generate-btn:hover {
            background: #d1a03c;
        }

        /* CHECKLIST STYLING */
        .checklist-section {
            margin-bottom: 24px;
            background: rgba(40, 34, 54, 0.4);
            padding: 12px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(63, 53, 88, 0.5);
        }

        .checklist-header {
            color: var(--accent-gold);
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--accent-purple);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .checklist-header::after {
            content: "▼";
            font-size: 0.8rem;
            color: var(--accent-gold);
            transition: transform 0.2s ease;
        }

        .checklist-section.collapsed .checklist-header::after {
            transform: rotate(-90deg);
        }

        .checklist-section.collapsed .check-item {
            display: none;
        }

        .check-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #3d3450;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .check-item:hover {
            background: #322b44;
        }

        .check-item.completed {
            background: rgba(40, 34, 54, 0.6);
            border-color: rgba(63, 53, 88, 0.4);
        }

        .check-item.completed .check-text {
            text-decoration: line-through;
            color: #8e839e;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 2px solid var(--accent-purple);
            border-radius: 6px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            transition: all 0.2s ease;
        }

        .check-item.completed .checkbox {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .check-item.completed .checkbox::after {
            content: "✓";
            color: #1a1625;
            font-weight: bold;
            font-size: 1rem;
        }

        .check-text {
            font-size: 0.95rem;
            flex-grow: 1;
            font-weight: 500;
            color: var(--text-light);
            transition: color 0.2s ease;
        }

        .check-qty {
            color: var(--accent-blue);
            font-weight: bold;
            font-size: 1rem;
            padding: 4px 10px;
            background: rgba(84, 178, 219, 0.15);
            border-radius: 6px;
            margin-left: 12px;
        }
        
        .check-item.completed .check-qty {
            opacity: 0.5;
        }

        .empty-state {
            text-align: center;
            color: #8e839e;
            padding: 40px 20px;
            font-style: italic;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px dashed var(--accent-purple);
        }

        /* EXPANDABLE FLOATING BOTTOM SHEET */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #201a2d;
            border-top: 2px solid var(--accent-gold);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(calc(100% - var(--bar-height)));
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

        .sheet-header {
            height: var(--bar-height);
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .drag-handle {
            width: 36px;
            height: 4px;
            background-color: #4a4466;
            border-radius: 2px;
            margin: 0 auto 6px;
        }

        .summary-bar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-badge {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: bold;
        }

        .toggle-btn {
            font-size: 0.8rem;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .sheet-body {
            padding: 0 16px 20px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .sheet-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3450;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .sheet-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-light);
        }

        .reset-link {
            font-size: 0.75rem;
            color: #d9534f;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .mat-tile {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tile-title {
            font-size: 0.75rem;
            color: #bfaecf;
        }

        .tile-count {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* Index & Glossary Grids */
        .index-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .glossary-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px;
            border: 1px solid #3d3450;
        }

        .glossary-title {
            color: var(--accent-gold);
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .glossary-sub {
            font-size: 0.8rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }

        .glossary-lore {
            font-size: 0.8rem;
            color: #d0c8e0;
            font-style: italic;
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .glossary-source {
            font-size: 0.75rem;
            color: #bfaecf;
            background: rgba(63, 53, 88, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="nav-header">
        <button class="tab-btn active" onclick="switchTab('calculatorTab', this)">Calculator</button>
        <button class="tab-btn" id="navChecklist" onclick="switchTab('checklistTab', this)">Active Checklist</button>
        <button class="tab-btn" onclick="switchTab('furnitureIndexTab', this)">Furniture Index</button>
        <button class="tab-btn" onclick="switchTab('indexTab', this)">Material Index</button>
    </div>

    <!-- TAB 1: CALCULATOR -->
    <div id="calculatorTab" class="tab-content active">
        <h1>Gwidam Workshop Planner</h1>
        
        <!-- Sub-Navigation Toggle -->
        <div class="sub-nav">
            <button class="sub-btn active-furniture" id="subTabFurniture" onclick="switchCategory('furniture')">Furniture</button>
            <button class="sub-btn" id="subTabPets" onclick="switchCategory('pets')">Pets & Divine Beasts</button>
        </div>

        <div class="furniture-grid" id="furnitureGrid"></div>
        <button class="generate-btn" onclick="generateChecklist()">Start Project (Create Checklist)</button>
    </div>

    <!-- TAB 2: CHECKLIST -->
    <div id="checklistTab" class="tab-content">
        <h1>Project Checklist</h1>
        <div id="checklistContainer">
            <div class="empty-state">No active project. Select items in the Calculator and click "Start Project" to generate your checklist.</div>
        </div>
    </div>

    <!-- TAB 3: FURNITURE INDEX -->
    <div id="furnitureIndexTab" class="tab-content">
        <h1>Furniture Catalog & Lore</h1>
        <div class="index-grid" id="furnitureIndexGrid"></div>
    </div>

    <!-- TAB 4: MATERIAL INDEX -->
    <div id="indexTab" class="tab-content">
        <h1>Material Glossary & Locations</h1>
        <div class="index-grid" id="indexGrid"></div>
    </div>

    <!-- EXPANDABLE BOTTOM SHEET OVERLAY -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-header" onclick="toggleSheet()">
            <div class="drag-handle"></div>
            <div class="summary-bar-content">
                <span class="time-badge" id="totalTimeDisplay">⏱️ 0m | 0 Items</span>
                <span class="toggle-btn" id="toggleLabel">Materials ▲</span>
            </div>
        </div>

        <div class="sheet-body">
            <div class="sheet-action-row">
                <span class="sheet-title">Required Materials</span>
                <button class="reset-link" onclick="resetQuantities()">Reset Quantities</button>
            </div>
            <div class="materials-grid" id="materialsGrid">
                <div class="mat-tile">
                    <span class="tile-title">Select Items</span>
                    <span class="tile-count">0</span>
                </div>
            </div>
        </div>
    </div>

<script>
const items = [
    { id: "traditional_jar", name: "Traditional Jar", timeMinutes: 30, mats: { "Guardian Yeopjeon": 40, "Stone": 10 }, lore: "Place it somewhere that gets plenty of sunshine.", image: "Traditional Jar.png" },
    { id: "guardian_monument", name: "Village Guardian Monument", timeMinutes: 30, mats: { "Guardian Yeopjeon": 60, "Health Charm": 5, "Stone": 20 }, lore: "A guardian monument that has watched over the village for generations.", image: "Village Guardian Monument.png" },
    { id: "mysterious_well", name: "Mysterious Well", timeMinutes: 80, mats: { "Guardian Yeopjeon": 60, "Eoduksini": 3, "Water": 10 }, lore: "Ancient secrets lie hidden deep within this well.", image: "Mysterious Well.png" },

    { id: "underworld_totem", name: "Female General of the Underworld Totem", timeMinutes: 150, mats: { "Guardian Yeopjeon": 150, "Female General Totem (Material)": 1, "Health Charm": 5 }, lore: "It is said to govern the energy that flows beneath the earth.", image: "Female General of the Underworld Totem.png" },
    { id: "heaven_totem", name: "Great General of All Under Heaven Totem", timeMinutes: 150, mats: { "Guardian Yeopjeon": 150, "Great General Totem (Material)": 1, "Health Charm": 5 }, lore: "Said to watch over the village and ward off evil spirits.", image: "Great General of All Under Heaven Totem.png" },
    { id: "haechi_statue", name: "Haechi Statue", timeMinutes: 390, mats: { "Guardian Yeopjeon": 250, "Haechi Statue (Material)": 1, "Yeopjeon Knot Ornament": 5, "Someone's Nameplate": 3 }, lore: "Imbued with the protective spirit of the righteous guardian beast, Haechi.", image: "Haechi Statue.png" },
    { id: "market_stall", name: "Village Market Stall", timeMinutes: 360, mats: { "Guardian Yeopjeon": 200, "Will-o'-the-Wisp": 5, "Someone's Nameplate": 3 }, lore: "A simple market stall that fits perfectly in a cozy village marketplace.", image: "Village Market Stall.png" },
    { id: "thatched_barn", name: "Thatched Barn", timeMinutes: 110, mats: { "Guardian Yeopjeon": 80, "Misfortune Doll": 5, "Tree Branch": 10 }, lore: "A cozy barn topped with warm straw.", image: "Thatched Barn.png" },
    { id: "traditional_signboard", name: "Traditional Signboard", timeMinutes: 180, mats: { "Guardian Yeopjeon": 100, "Someone's Norigae": 10, "Misfortune Doll": 5 }, lore: "Leave a message for the village.", image: "Traditional Signboard.png" },
    { id: "wooden_platform", name: "Peaceful Wooden Platform", timeMinutes: 40, mats: { "Guardian Yeopjeon": 40, "Tree Branch": 20 }, lore: "Take a break and enjoy the gentle breeze.", image: "Peaceful Wooden Platform.png" }
];

const pets = [
    { id: "divine_beast_supplement", name: "Divine Beast Supplement", timeMinutes: 40, mats: { "Guardian Yeopjeon": 50, "Misfortune Doll": 3, "Water": 5 }, lore: "Filled with pure spiritual energy to nurture the growth of your Divine Beast. Increases EXP by 50.", image: "divine_beast_supplement.png" },
    { id: "premium_divine_beast_supplement", name: "Premium Divine Beast Supplement", timeMinutes: 40, mats: { "Guardian Yeopjeon": 100, "Will-o'-the-Wisp": 1, "Water": 5 }, lore: "Filled with pure spiritual energy to nurture the growth of your Divine Beast. Increases EXP by 200.", image: "premium_divine_beast_supplement.png" },
    { id: "super_premium_divine_beast_supplement", name: "Super Premium Divine Beast Supplement", timeMinutes: 40, mats: { "Guardian Yeopjeon": 150, "Eoduksini": 1, "Water": 5 }, lore: "Filled with pure spiritual energy to nurture the growth of your Divine Beast. Increases EXP by 700.", image: "super_premium_divine_beast_supplement.png" },

    { id: "divine_beast_egg_normal", name: "Divine Beast Egg (Normal)", timeMinutes: 100, mats: { "Guardian Yeopjeon": 200, "Normal Egg": 1 }, lore: "A mysterious presence can be felt from within the shell.", image: "divine_beast_egg.png" },
    { id: "divine_beast_egg_premium", name: "Divine Beast Egg (Premium)", timeMinutes: 100, mats: { "Guardian Yeopjeon": 100, "Premium Egg": 1 }, lore: "A mysterious presence can be felt from within the shell.", image: "divine_beast_egg.png" }

const glossary = [
    { name: "Ivory Cube", source: "Furniture Shop", lore: "Let's stack the neat-looking cubes one by one." },
    { name: "Water", source: "Mega Mart", lore: "There's nothing like water to quench your thirst. Doesn't have any special abilities." },

    { name: "Cursed Scarecrow", source: "Gwidam Village All Areas All Day", lore: "Time of Appearance: Ghost Story Event Season" },

    { name: "Haechi Statue (Material)", source: "Excavation", lore: "Imbued with the protective spirit of the righteous guardian beast, Haechi." },
    { name: "Someone's Norigae", source: "(Excavation) Mysterious Jar", lore: "Its former brilliance has faded, but the signs of having been dearly cherished remain." },
    { name: "Female General Totem (Material)", source: "Excavation", lore: "It is said to govern the energy that flows beneath the earth." },

    { name: "Health Charm", source: "(Excavation) Mysterious Jar", lore: "A charm filled with wishes for good health in both body and mind." },

    { name: "Guardian Yeopjeon", source: "Event", lore: "Used at the Haechi Altar to pray for health and peace. Used in events." },

    { name: "Premium Egg", source: "Pet Paradise (Gem / Paid Currency)", lore: "A premium egg containing higher-tier pet companion potential." }

let quantities = {};
let checklistProgress = {};
let currentCategory = 'furniture'; // Tracks active sub-tab

function loadSavedData() {
    try {
        const savedQuantities = localStorage.getItem("gwidam_workshop_quantities");
        if (savedQuantities) quantities = JSON.parse(savedQuantities);

        const savedChecklist = localStorage.getItem("gwidam_workshop_checklist");
        if (savedChecklist) checklistProgress = JSON.parse(savedChecklist);
        
        if (Object.values(quantities).some(q => q > 0)) {
            renderChecklist();
        }
    } catch (e) {
        quantities = {};
        checklistProgress = {};
    }
}

function saveQuantities() {
    try { localStorage.setItem("gwidam_workshop_quantities", JSON.stringify(quantities)); } catch (e) {}
}

function saveChecklist() {
    try { localStorage.setItem("gwidam_workshop_checklist", JSON.stringify(checklistProgress)); } catch (e) {}
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');

    const sheet = document.getElementById('bottomSheet');
    if (tabId === 'calculatorTab') {
        sheet.style.display = 'block';
        document.body.style.paddingBottom = 'calc(var(--bar-height) + 40px)';
    } else {
        sheet.style.display = 'none';
        document.body.style.paddingBottom = '40px';
    }
}

function switchCategory(category) {
    currentCategory = category;
    
    // Update button styling
    const furnBtn = document.getElementById('subTabFurniture');
    const petsBtn = document.getElementById('subTabPets');
    
    if (category === 'furniture') {
        furnBtn.classList.add('active-furniture');
        petsBtn.classList.remove('active-pets');
    } else {
        furnBtn.classList.remove('active-furniture');
        petsBtn.classList.add('active-pets');
    }
    
    renderGrid();
}

function toggleSheet() {
    const sheet = document.getElementById('bottomSheet');
    const label = document.getElementById('toggleLabel');
    sheet.classList.toggle('open');
    
    if (sheet.classList.contains('open')) {
        label.innerText = 'Hide ▼';
    } else {
        label.innerText = 'Materials ▲';
    }
}

function formatTime(minutes) {
    const hrs = Math.floor(minutes / 60);
    const mins = minutes % 60;
    if (hrs === 0) return `${mins}m`;
    if (mins === 0) return `${hrs}h`;
    return `${hrs}h ${mins}m`;
}

function generateChecklist() {
    const hasItems = Object.values(quantities).some(q => q > 0);
    if (!hasItems) {
        alert("Please select at least one item in the calculator first!");
        return;
    }
    
    const navBtn = document.getElementById('navChecklist');
    switchTab('checklistTab', navBtn);
    renderChecklist();
    calculateTotals();
}

function toggleChecklistSection(element) {
    element.parentElement.classList.toggle('collapsed');
}

function toggleCheckItem(id, element) {
    checklistProgress[id] = !checklistProgress[id];
    saveChecklist();
    
    if (checklistProgress[id]) {
        element.classList.add("completed");
    } else {
        element.classList.remove("completed");
    }

    calculateTotals();

    // Auto-collapse section if everything is completed
    const section = element.closest('.checklist-section');
    if (section) {
        const allItems = section.querySelectorAll('.check-item');
        const allCompleted = Array.from(allItems).every(item => item.classList.contains('completed'));
        
        if (allCompleted) {
            setTimeout(() => {
                const currentCompleted = Array.from(allItems).every(item => item.classList.contains('completed'));
                if (currentCompleted) {
                    section.classList.add('collapsed');
                }
            }, 400); 
        }
    }
}

// Activity Categorization Helper
function getCategoryForMaterial(matName) {
    const netItems = ["Cursed Scarecrow", "Eoduksini", "Will-o'-the-Wisp"];
    const excavationItems = [
        "Someone's Nameplate", "Yeopjeon Knot Ornament", "Haechi Statue (Material)", 
        "Someone's Norigae", "Female General Totem (Material)", "Great General Totem (Material)", 
        "Health Charm", "Misfortune Doll"
    ];

    if (netItems.includes(matName)) {
        return "Catching (Net)";
    }
    if (excavationItems.includes(matName)) {
        return "Excavation";
    }
    if (matName === "Tree Branch") {
        return "Gathering";
    }
    if (matName === "Stone") {
        return "Mining";
    }
    if (matName === "Water") {
        return "Mega Mart";
    }
    if (matName === "Guardian Yeopjeon") {
        return "Events";
    }
    if (matName === "Normal Egg" || matName === "Premium Egg") {
        return "Pet Paradise";
    }
    if (matName === "Ivory Cube") {
        return "Furniture Shop";
    }
    return "Other Materials";
}

function renderChecklist() {
    const container = document.getElementById("checklistContainer");
    const matTotals = {};
    let hasItems = false;
    
    const allCraftables = [...items, ...pets];

    allCraftables.forEach(item => {
        const qty = quantities[item.id] || 0;
        if (qty > 0) {
            hasItems = true;
            Object.entries(item.mats).forEach(([mat, count]) => {
                matTotals[mat] = (matTotals[mat] || 0) + (count * qty);
            });
        }
    });

    if (!hasItems) {
        container.innerHTML = `<div class="empty-state">No active project. Select items in the Calculator and click "Start Project" to generate your checklist.</div>`;
        return;
    }

    const groupedMats = {};
    Object.entries(matTotals).forEach(([mat, total]) => {
        const category = getCategoryForMaterial(mat);
        if (!groupedMats[category]) groupedMats[category] = [];
        groupedMats[category].push({ name: mat, total });
    });

    let html = ``;

    // 1. Render Material Categories
    for (const [category, mats] of Object.entries(groupedMats)) {
        html += `<div class="checklist-section">
                    <div class="checklist-header" onclick="toggleChecklistSection(this)">
                        <span>📌 ${category}</span>
                    </div>`;
        mats.forEach(m => {
            const checkId = `mat_${m.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const isChecked = checklistProgress[checkId] ? "completed" : "";
            html += `
                <div class="check-item ${isChecked}" onclick="toggleCheckItem('${checkId}', this)">
                    <div class="checkbox"></div>
                    <div class="check-text">${m.name}</div>
                    <div class="check-qty" id="qty_${checkId}">x${m.total.toLocaleString()}</div>
                </div>`;
        });
        html += `</div>`;
    }

    // 2. Render Furniture Assembly Queue
    let hasFurniture = false;
    let furnitureHtml = `<div class="checklist-section" style="margin-top: 32px;">
                            <div class="checklist-header" onclick="toggleChecklistSection(this)">
                                <span>🔨 Furniture Assembly</span>
                            </div>`;
    items.forEach(item => {
        const qty = quantities[item.id] || 0;
        if (qty > 0) hasFurniture = true;
        for (let i = 0; i < qty; i++) {
            const checkId = `craft_${item.id}_${i}`;
            const isChecked = checklistProgress[checkId] ? "completed" : "";
            furnitureHtml += `
                <div class="check-item ${isChecked}" onclick="toggleCheckItem('${checkId}', this)">
                    <div class="checkbox"></div>
                    <div class="check-text">${item.name} ${qty > 1 ? `<span style="opacity:0.6; font-size:0.8rem;">(#${i+1})</span>` : ''}</div>
                    <div class="check-qty" style="background: rgba(226, 176, 71, 0.15); color: var(--accent-gold);">⏱️ ${formatTime(item.timeMinutes)}</div>
                </div>`;
        }
    });
    furnitureHtml += `</div>`;
    if (hasFurniture) html += furnitureHtml;

    // 3. Render Pet Assembly / Incubator Queue
    let hasPets = false;
    let petsHtml = `<div class="checklist-section" style="margin-top: 32px;">
                        <div class="checklist-header" onclick="toggleChecklistSection(this)">
                            <span style="color: var(--accent-pet);">🐾 Pet & Divine Beast Incubator</span>
                        </div>`;
    pets.forEach(pet => {
        const qty = quantities[pet.id] || 0;
        if (qty > 0) hasPets = true;
        for (let i = 0; i < qty; i++) {
            const checkId = `craft_${pet.id}_${i}`;
            const isChecked = checklistProgress[checkId] ? "completed" : "";
            petsHtml += `
                <div class="check-item ${isChecked}" onclick="toggleCheckItem('${checkId}', this)">
                    <div class="checkbox"></div>
                    <div class="check-text">${pet.name} ${qty > 1 ? `<span style="opacity:0.6; font-size:0.8rem;">(#${i+1})</span>` : ''}</div>
                    <div class="check-qty" style="background: rgba(50, 168, 115, 0.15); color: var(--accent-pet);">⏱️ ${formatTime(pet.timeMinutes)}</div>
                </div>`;
        }
    });
    petsHtml += `</div>`;
    if (hasPets) html += petsHtml;

    container.innerHTML = html;

    // Apply auto-collapse on initial render for fully completed sections
    container.querySelectorAll('.checklist-section').forEach(section => {
        const checkItems = section.querySelectorAll('.check-item');
        if (checkItems.length > 0) {
            const allCompleted = Array.from(checkItems).every(item => item.classList.contains('completed'));
            if (allCompleted) {
                section.classList.add('collapsed');
            }
        }
    });
}

function updateQty(id, change) {
    quantities[id] = Math.max(0, (quantities[id] || 0) + change);
    saveQuantities();
    renderGrid();
    
    if (Object.values(quantities).some(q => q > 0)) {
        renderChecklist(); 
    } else {
        document.getElementById("checklistContainer").innerHTML = `<div class="empty-state">No active project. Select items in the Calculator and click "Start Project" to generate your checklist.</div>`;
    }
    
    calculateTotals();
}

function resetQuantities() {
    Object.keys(quantities).forEach(id => quantities[id] = 0);
    checklistProgress = {};
    saveQuantities();
    saveChecklist();
    renderGrid();
    renderChecklist();
    calculateTotals();
}

function calculateTotals() {
    const matTotals = {};
    const initialMatTotals = {};
    const taskDurations = [];
    let totalItemCount = 0;
    let remainingItemCount = 0;

    const allCraftables = [...items, ...pets];

    // 1. Calculate Target Totals, Subtract Checked Crafts, & Track Remaining Time
    allCraftables.forEach(item => {
        const qty = quantities[item.id] || 0;
        if (qty > 0) {
            totalItemCount += qty;
            
            Object.entries(item.mats).forEach(([mat, count]) => {
                initialMatTotals[mat] = (initialMatTotals[mat] || 0) + (count * qty);
                matTotals[mat] = (matTotals[mat] || 0) + (count * qty);
            });

            for (let i = 0; i < qty; i++) {
                const craftCheckId = `craft_${item.id}_${i}`;
                if (checklistProgress[craftCheckId]) {
                    // Item completed in assembly queue -> subtract its individual mat costs
                    Object.entries(item.mats).forEach(([mat, count]) => {
                        matTotals[mat] = Math.max(0, (matTotals[mat] || 0) - count);
                    });
                } else {
                    taskDurations.push(item.timeMinutes);
                    remainingItemCount++;
                }
            }
        }
    });

    // 2. Subtract Raw Materials Checked Off in Shopping List
    Object.keys(initialMatTotals).forEach(mat => {
        const matCheckId = `mat_${mat.replace(/[^a-zA-Z0-9]/g, '_')}`;
        if (checklistProgress[matCheckId]) {
            matTotals[mat] = 0;
        }
    });

    const matsGridEl = document.getElementById("materialsGrid");
    matsGridEl.innerHTML = "";

    const sortedMats = Object.entries(initialMatTotals).sort((a, b) => b[1] - a[1]);

    if (sortedMats.length === 0) {
        matsGridEl.innerHTML = `
            <div class="mat-tile">
                <span class="tile-title">Select Items</span>
                <span class="tile-count">0</span>
            </div>`;
    } else {
        sortedMats.forEach(([mat, initialTotal]) => {
            const currentReq = matTotals[mat] !== undefined ? matTotals[mat] : initialTotal;
            
            // Build Bottom Sheet Tile
            const tile = document.createElement("div");
            tile.className = "mat-tile";
            
            if (currentReq === 0) {
                tile.style.opacity = "0.5";
                tile.style.borderColor = "rgba(63, 53, 88, 0.4)";
            }

            tile.innerHTML = `
                <span class="tile-title">${mat}</span>
                <span class="tile-count">${currentReq.toLocaleString()} <span style="font-size:0.75rem; color:#8e839e; font-weight:normal;">/ ${initialTotal.toLocaleString()}</span></span>`;
            matsGridEl.appendChild(tile);

            // Dynamically Sync the DOM Elements on the Checklist Page (so both update together)
            const matCheckId = `mat_${mat.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const checklistQtyEl = document.getElementById(`qty_${matCheckId}`);
            if (checklistQtyEl) {
                checklistQtyEl.innerHTML = `x${currentReq.toLocaleString()} <span style="font-size:0.75rem; font-weight:normal; opacity:0.6;">/ ${initialTotal.toLocaleString()}</span>`;
            }
        });
    }

    const totalParallelTime = calculateParallelTime(taskDurations, 4);
    document.getElementById("totalTimeDisplay").innerText = `⏱️ ${formatTime(totalParallelTime)} | ${remainingItemCount} / ${totalItemCount} Items`;
}

function calculateParallelTime(durations, maxSlots) {
    if (durations.length === 0) return 0;
    durations.sort((a, b) => b - a);
    const slots = new Array(maxSlots).fill(0);

    durations.forEach(duration => {
        let earliestSlot = 0;
        for (let i = 1; i < maxSlots; i++) {
            if (slots[i] < slots[earliestSlot]) {
                earliestSlot = i;
            }
        }
        slots[earliestSlot] += duration;
    });

    return Math.max(...slots);
}

loadSavedData();
renderGrid();
renderFurnitureIndex();
renderIndex();
calculateTotals();

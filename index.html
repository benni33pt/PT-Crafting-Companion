<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayTogether Workshop Companion</title>
    <style>
        :root {
            --bg-color: #0A0A0A;
            --card-bg: #1A1A1A;
            --accent-purple: #2D2638; /* Kept variable name for engine compatibility, updated to charcoal */
            --text-light: #F4F4F5;
            --accent-gold: #E8C340;
            --accent-blue: #17B2B2; /* Swapped to Nile Teal for time badges */
            --accent-pet: #32a873; 
            --border-radius: 12px;
            --bar-height: 60px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            padding-bottom: calc(var(--bar-height) + 40px);
        }

        /* STICKY HEADER & NAV */
        .nav-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            padding: 10px 12px;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--accent-gold);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .home-btn {
            background-color: var(--accent-gold);
            color: #0A0A0A;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            display: none; /* Only shown in archives */
            white-space: nowrap;
        }

        .tab-btn-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        
        .tab-btn-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--accent-gold);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-gold);
            color: #0A0A0A;
        }

        .tab-content {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }

        .tab-content.active {
            display: block;
        }

        /* PARALLAX HERO BANNER */
        .hero-banner-container {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            display: block;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .hero-fade-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to bottom, rgba(10, 10, 10, 0) 20%, rgba(10, 10, 10, 1) 100%);
        }

        .hero-title {
            position: absolute;
            bottom: 12px;
            width: 100%;
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            margin: 0;
        }

        /* SLIDE-OUT HAMBURGER DRAWER */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: none;
        }

        .drawer-overlay.open {
            display: block;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: var(--card-bg);
            border-right: 2px solid var(--accent-gold);
            z-index: 201;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .drawer-title {
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .drawer-section-title {
            font-size: 0.75rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        .drawer-link {
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .drawer-link:hover {
            background: rgba(232, 195, 64, 0.15);
            color: var(--accent-gold);
        }

        /* PLACEHOLDER COMING SOON CARD */
        .coming-soon-card {
            background: var(--card-bg);
            border: 1px dashed var(--accent-gold);
            border-radius: var(--border-radius);
            padding: 32px 20px;
            text-align: center;
            margin-top: 12px;
        }

        .coming-soon-title {
            color: var(--accent-gold);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .coming-soon-text {
            color: #A0A0A0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* ENGINE STYLING (From Source 2) */
        .sub-nav { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .sub-btn { background-color: var(--bg-color); color: #8e839e; border: 2px solid var(--accent-purple); padding: 6px 16px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; }
        .sub-btn.active-furniture { background-color: rgba(232, 195, 64, 0.15); color: var(--accent-gold); border-color: var(--accent-gold); }
        .sub-btn.active-pets { background-color: rgba(50, 168, 115, 0.15); color: var(--accent-pet); border-color: var(--accent-pet); }

        .furniture-grid, .index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .item-card, .glossary-card { background-color: var(--card-bg); border-radius: var(--border-radius); padding: 14px; border: 1px solid #333; transition: border-color 0.2s ease; }
        .item-card { display: flex; flex-direction: column; justify-content: space-between; }
        .item-card.pet-card { border: 1px solid rgba(50, 168, 115, 0.4); }

        .card-img-container { text-align: center; margin-bottom: 12px; background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 8px; }
        .item-preview-img { max-width: 100%; height: 100px; object-fit: contain; }
        .index-preview-img { max-width: 100%; height: 140px; object-fit: contain; }

        .item-name, .glossary-title { font-weight: bold; font-size: 0.95rem; color: #ffffff; margin-bottom: 4px; }
        .glossary-title { color: var(--accent-gold); font-size: 1rem; }
        .pet-card .item-name { color: var(--accent-pet); }
        .item-time, .glossary-sub { font-size: 0.8rem; color: var(--accent-blue); margin-bottom: 8px; }
        .item-mats, .glossary-source { font-size: 0.75rem; color: #bfaecf; margin-bottom: 12px; line-height: 1.3; }
        .glossary-source { background: rgba(232, 195, 64, 0.15); color: var(--text-light); padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .glossary-lore { font-size: 0.8rem; color: #CCCCCC; font-style: italic; margin-bottom: 10px; line-height: 1.35; }

        .controls { display: flex; align-items: center; justify-content: space-between; background: var(--bg-color); border-radius: 8px; padding: 4px; }
        .btn { background: var(--accent-purple); color: white; border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .qty-input { width: 40px; text-align: center; background: transparent; border: none; color: white; font-weight: bold; font-size: 1rem; }

        .generate-btn { display: block; width: 100%; padding: 16px; background: var(--accent-gold); color: #0A0A0A; font-weight: bold; font-size: 1.1rem; text-align: center; border: none; border-radius: var(--border-radius); cursor: pointer; margin-top: 24px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease; }
        .generate-btn:hover { background: #d1a03c; }

        /* CHECKLIST */
        .checklist-section { margin-bottom: 24px; background: rgba(26, 26, 26, 0.4); padding: 12px; border-radius: var(--border-radius); border: 1px solid rgba(232, 195, 64, 0.3); }
        .checklist-header { color: var(--accent-gold); padding-bottom: 8px; margin-bottom: 12px; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--accent-gold); cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .checklist-header::after { content: "▼"; font-size: 0.8rem; color: var(--accent-gold); transition: transform 0.2s ease; }
        .checklist-section.collapsed .checklist-header::after { transform: rotate(-90deg); }
        .checklist-section.collapsed .check-item, .checklist-section.collapsed .completed-toggle, .checklist-section.collapsed .completed-container { display: none !important; }

        .check-item { display: flex; align-items: center; background: var(--card-bg); padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #333; cursor: pointer; transition: all 0.2s ease; user-select: none; }
        .check-item:hover { background: #222; }
        .check-item.completed { background: rgba(26, 26, 26, 0.6); border-color: rgba(232, 195, 64, 0.2); }
        .check-item.completed .check-text { text-decoration: line-through; color: #8e839e; }

        .checkbox { width: 24px; height: 24px; min-width: 24px; border: 2px solid var(--accent-gold); border-radius: 6px; margin-right: 14px; display: flex; align-items: center; justify-content: center; background: var(--bg-color); transition: all 0.2s ease; }
        .check-item.completed .checkbox { background: var(--accent-gold); border-color: var(--accent-gold); }
        .check-item.completed .checkbox::after { content: "✓"; color: #0A0A0A; font-weight: bold; font-size: 1rem; }
        .check-text { font-size: 0.95rem; flex-grow: 1; font-weight: 500; color: var(--text-light); transition: color 0.2s ease; }
        .check-qty { color: var(--accent-blue); font-weight: bold; font-size: 1rem; padding: 4px 10px; background: rgba(23, 178, 178, 0.15); border-radius: 6px; margin-left: 12px; }
        .check-item.completed .check-qty { opacity: 0.5; }

        .completed-toggle { font-size: 0.85rem; color: #8e839e; text-align: center; margin: 12px 0 8px; padding: 8px; cursor: pointer; background: rgba(0, 0, 0, 0.2); border-radius: 6px; user-select: none; transition: all 0.2s; }
        .completed-toggle:hover { color: var(--accent-gold); background: rgba(0, 0, 0, 0.4); }
        .empty-state { text-align: center; color: #8e839e; padding: 40px 20px; font-style: italic; background: var(--card-bg); border-radius: var(--border-radius); border: 1px dashed var(--accent-purple); }

        /* BOTTOM SHEET */
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background-color: #111; border-top: 2px solid var(--accent-gold); border-top-left-radius: 16px; border-top-right-radius: 16px; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.8); z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(calc(100% - var(--bar-height))); }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-header { height: var(--bar-height); padding: 8px 16px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; user-select: none; }
        .drag-handle { width: 36px; height: 4px; background-color: #333; border-radius: 2px; margin: 0 auto 6px; }
        .summary-bar-content { display: flex; justify-content: space-between; align-items: center; }
        .time-badge { font-size: 0.85rem; color: var(--accent-blue); font-weight: bold; }
        .toggle-btn { font-size: 0.8rem; color: var(--accent-gold); font-weight: bold; }
        .sheet-body { padding: 0 16px 20px; max-height: 50vh; overflow-y: auto; }
        .sheet-action-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; }
        .sheet-title { font-size: 0.85rem; font-weight: bold; color: var(--text-light); }
        .reset-link { font-size: 0.75rem; color: #d9534f; background: none; border: none; cursor: pointer; text-decoration: underline; }
        .materials-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .mat-tile { background-color: var(--card-bg); border: 1px solid #333; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
        .tile-title { font-size: 0.75rem; color: #bfaecf; }
        .tile-count { font-size: 0.9rem; font-weight: bold; color: var(--accent-gold); }
    </style>
</head>
<body>

    <!-- STICKY TOP NAV -->
    <div class="nav-header">
        <button class="menu-btn" onclick="toggleDrawer()">≡</button>
        <button class="home-btn" id="homeBtn" onclick="loadActiveEventView()">🏠 Back to Current Event</button>
        <div class="tab-btn-container" id="tabBtnContainer">
            <button class="tab-btn active" onclick="switchTab('calculatorTab', this)">Calculator</button>
            <button class="tab-btn" id="navChecklist" onclick="switchTab('checklistTab', this)">Active Checklist</button>
        </div>
    </div>

    <!-- HAMBURGER DRAWER -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <span class="drawer-title">Navigation Hub</span>
            <button class="close-btn" onclick="toggleDrawer()">✕</button>
        </div>

        <div class="drawer-section-title">📚 Material & Item Index</div>
        <div class="drawer-link" onclick="loadCoreIndex()">PlayTogether Core</div>
        <div class="drawer-link" onclick="loadGwidamIndex()">Gwidam Village Index</div>
    </div>

    <!-- ACTIVE EVENT LANDING PAGE (Desert Oasis Engine) -->
    <div id="activeEventContainer">
        
        <div class="hero-banner-container" id="heroBanner">
            <img src="Images/DesertOasis/Desert Oasis Key Art.jpg" alt="Desert Oasis Key Art" class="hero-img">
            <div class="hero-fade-overlay"></div>
            <h1 class="hero-title">Desert Oasis</h1>
        </div>

        <div id="calculatorTab" class="tab-content active">
            <!-- Sub-Navigation Toggle -->
            <div class="sub-nav" id="activeSubNav" style="display: none;">
                <button class="sub-btn active-furniture" id="subTabFurniture" onclick="switchCategory('furniture')">Furniture</button>
                <button class="sub-btn" id="subTabPets" onclick="switchCategory('pets')">Pets & Divine Beasts</button>
            </div>

            <div class="furniture-grid" id="furnitureGrid"></div>
            <button class="generate-btn" id="generateBtn" style="display: none;" onclick="generateChecklist()">Start Project (Create Checklist)</button>
        </div>

        <div id="checklistTab" class="tab-content">
            <div id="checklistContainer"></div>
        </div>

        <!-- EXPANDABLE BOTTOM SHEET OVERLAY -->
        <div class="bottom-sheet" id="bottomSheet" style="display: none;">
            <div class="sheet-header" onclick="toggleSheet()">
                <div class="drag-handle"></div>
                <div class="summary-bar-content">
                    <span class="time-badge" id="totalTimeDisplay">⏱️ 0m | 0 Items</span>
                    <span class="toggle-btn" id="toggleLabel">Materials ▲</span>
                </div>
            </div>

            <div class="sheet-body">
                <div class="sheet-action-row">
                    <span class="sheet-title">Required Materials</span>
                    <button class="reset-link" onclick="resetQuantities()">Reset Quantities</button>
                </div>
                <div class="materials-grid" id="materialsGrid">
                    <div class="mat-tile">
                        <span class="tile-title">Select Items</span>
                        <span class="tile-count">0</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ARCHIVE VIEW CONTAINER -->
    <div id="archiveContainer" class="tab-content" style="padding-top: 24px;">
        <h1 id="archiveTitle" style="text-align: center; color: var(--accent-gold); margin-bottom: 20px; margin-top: 0;">Event Archive</h1>
        <div class="index-grid" id="archiveGrid"></div>
    </div>

    <!-- EXTERNAL DECOUPLED DATA FILES -->
    <script src="js/playtogether_core.js"></script>
    <script src="js/gwidam_data.js"></script>

<script>
/* =====================================================================
   ACTIVE EVENT DATA ENGINE (Currently set to empty for Desert Oasis)
   Once you have the event items, simply paste them into these arrays!
   ===================================================================== */
const items = [];
const pets = [];
const glossary = [];

/* =====================================================================
   STATE MANAGEMENT (Updated LocalStorage Keys to prevent collision!)
   ===================================================================== */
let quantities = {};
let completedCrafts = {};
let checklistProgress = {};
let showCompleted = { furniture: false, pets: false };
let currentCategory = 'furniture'; 

function loadSavedData() {
    try {
        const savedQuantities = localStorage.getItem("active_event_quantities");
        if (savedQuantities) quantities = JSON.parse(savedQuantities);
        
        const savedCompleted = localStorage.getItem("active_event_completed");
        if (savedCompleted) completedCrafts = JSON.parse(savedCompleted);

        const savedChecklist = localStorage.getItem("active_event_checklist");
        if (savedChecklist) checklistProgress = JSON.parse(savedChecklist);
        
        if (Object.values(quantities).some(q => q > 0) || Object.values(completedCrafts).some(q => q > 0)) {
            renderChecklist();
        }
    } catch (e) {
        quantities = {};
        completedCrafts = {};
        checklistProgress = {};
    }
}

function saveQuantities() {
    try { localStorage.setItem("active_event_quantities", JSON.stringify(quantities)); } catch (e) {}
}

function saveCompleted() {
    try { localStorage.setItem("active_event_completed", JSON.stringify(completedCrafts)); } catch (e) {}
}

function saveChecklist() {
    try { localStorage.setItem("active_event_checklist", JSON.stringify(checklistProgress)); } catch (e) {}
}

/* =====================================================================
   NAVIGATION & UI CONTROLS
   ===================================================================== */
function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('drawerOverlay').classList.toggle('open');
}

function switchTab(tabId, btn) {
    document.querySelectorAll('#activeEventContainer .tab-content').forEach(tc => tc.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');

    // Only show bottom sheet if there is active data
    const sheet = document.getElementById('bottomSheet');
    if (tabId === 'calculatorTab' && items.length > 0) {
        sheet.style.display = 'block';
        document.body.style.paddingBottom = 'calc(var(--bar-height) + 40px)';
    } else {
        sheet.style.display = 'none';
        document.body.style.paddingBottom = '40px';
    }
}

function loadActiveEventView() {
    document.getElementById('archiveContainer').style.display = 'none';
    document.getElementById('activeEventContainer').style.display = 'block';
    document.getElementById('homeBtn').style.display = 'none';
    document.getElementById('tabBtnContainer').style.display = 'flex';
    if (document.getElementById('drawer').classList.contains('open')) toggleDrawer();
}

function switchCategory(category) {
    currentCategory = category;
    const furnBtn = document.getElementById('subTabFurniture');
    const petsBtn = document.getElementById('subTabPets');
    
    if (category === 'furniture') {
        furnBtn.classList.add('active-furniture');
        petsBtn.classList.remove('active-pets');
    } else {
        furnBtn.classList.remove('active-furniture');
        petsBtn.classList.add('active-pets');
    }
    renderGrid();
}

function toggleSheet() {
    const sheet = document.getElementById('bottomSheet');
    const label = document.getElementById('toggleLabel');
    sheet.classList.toggle('open');
    label.innerText = sheet.classList.contains('open') ? 'Hide ▼' : 'Materials ▲';
}

function formatTime(minutes) {
    const hrs = Math.floor(minutes / 60);
    const mins = minutes % 60;
    if (hrs === 0) return `${mins}m`;
    if (mins === 0) return `${hrs}h`;
    return `${hrs}h ${mins}m`;
}

/* =====================================================================
   ACTIVE EVENT CALCULATOR & CHECKLIST LOGIC
   ===================================================================== */
function renderGrid() {
    const grid = document.getElementById("furnitureGrid");
    grid.innerHTML = "";

    // "Coming Soon" Fallback if data arrays are empty
    if (items.length === 0 && pets.length === 0) {
        grid.innerHTML = `
            <div class="coming-soon-card" style="grid-column: 1 / -1;">
                <div class="coming-soon-title">Desert Oasis — Calculator Coming Soon</div>
                <div class="coming-soon-text">Check back here when the event drops to plan your new workshop queue!</div>
            </div>`;
        return;
    }

    // Reveal UI if data exists
    document.getElementById('activeSubNav').style.display = 'flex';
    document.getElementById('generateBtn').style.display = 'block';
    document.getElementById('bottomSheet').style.display = 'block';

    const activeItems = currentCategory === 'furniture' ? items : pets;

    activeItems.forEach(item => {
        quantities[item.id] = quantities[item.id] || 0;
        const matString = Object.entries(item.mats).map(([mat, count]) => `${count} ${mat}`).join(", ");
        const imgHtml = item.image ? `<div class="card-img-container"><img src="${item.image}" alt="${item.name}" class="item-preview-img"></div>` : '';
        const cardClass = currentCategory === 'pets' ? "item-card pet-card" : "item-card";

        const card = document.createElement("div");
        card.className = cardClass;
        card.innerHTML = `
            <div>
                ${imgHtml}
                <div class="item-name">${item.name}</div>
                <div class="item-time">⏱️ ${formatTime(item.timeMinutes)}</div>
                <div class="item-mats">${matString}</div>
            </div>
            <div class="controls">
                <button class="btn" onclick="updateQty('${item.id}', -1)">-</button>
                <input type="text" class="qty-input" value="${quantities[item.id]}" readonly>
                <button class="btn" onclick="updateQty('${item.id}', 1)">+</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

function generateChecklist() {
    const hasItems = Object.values(quantities).some(q => q > 0);
    const hasCompleted = Object.values(completedCrafts).some(q => q > 0);
    if (!hasItems && !hasCompleted) {
        alert("Please select at least one item in the calculator first!");
        return;
    }
    
    const navBtn = document.getElementById('navChecklist');
    switchTab('checklistTab', navBtn);
    renderChecklist();
    calculateTotals();
}

function toggleChecklistSection(element) {
    element.parentElement.classList.toggle('collapsed');
}

function toggleCheckItem(id, element) {
    checklistProgress[id] = !checklistProgress[id];
    saveChecklist();
    
    if (checklistProgress[id]) {
        element.classList.add("completed");
    } else {
        element.classList.remove("completed");
    }
    calculateTotals();
}

function completeCraft(itemId, element) {
    if (quantities[itemId] > 0 && !element.classList.contains('processing')) {
        element.classList.add('processing'); 
        element.classList.add('completed'); 
        
        setTimeout(() => {
            quantities[itemId]--;
            completedCrafts[itemId] = (completedCrafts[itemId] || 0) + 1;
            saveQuantities();
            saveCompleted();
            renderGrid();
            renderChecklist();
            calculateTotals();
        }, 500); // Maintained 500ms delay[cite: 2]
    }
}

function undoCraft(itemId) {
    if (completedCrafts[itemId] > 0) {
        completedCrafts[itemId]--;
        quantities[itemId]++;
        saveQuantities();
        saveCompleted();
        renderGrid();
        renderChecklist();
        calculateTotals();
    }
}

function toggleCompletedVisibility(type) {
    showCompleted[type] = !showCompleted[type];
    renderChecklist();
}

function getCategoryForMaterial(matName) {
    const excavationItems = ["Someone's Nameplate", "Yeopjeon Knot Ornament", "Haechi Statue (Material)", "Female General Totem (Material)", "Great General Totem (Material)", "Health Charm", "Misfortune Doll"];
    if (excavationItems.includes(matName)) return "Excavation";
    if (matName === "Tree Branch") return "Gathering";
    if (matName === "Stone") return "Mining";
    if (matName === "Water") return "Mega Mart";
    if (matName === "Normal Egg" || matName === "Premium Egg") return "Pet Paradise";
    if (matName === "Ivory Cube") return "Furniture Shop";
    return "Other Materials";
}

function renderChecklist() {
    const container = document.getElementById("checklistContainer");
    
    if (items.length === 0 && pets.length === 0) {
        container.innerHTML = `
            <div class="coming-soon-card">
                <div class="coming-soon-title">Active Checklist Empty</div>
                <div class="coming-soon-text">No active project right now. Select items on the Calculator once the event starts!</div>
            </div>`;
        return;
    }

    const matTotals = {};
    let hasActiveOrCompletedItems = false;
    const allCraftables = [...items, ...pets];

    allCraftables.forEach(item => {
        const activeQty = quantities[item.id] || 0;
        const completedQty = completedCrafts[item.id] || 0;
        if (activeQty > 0 || completedQty > 0) hasActiveOrCompletedItems = true;
        if (activeQty > 0) {
            Object.entries(item.mats).forEach(([mat, count]) => {
                matTotals[mat] = (matTotals[mat] || 0) + (count * activeQty);
            });
        }
    });

    if (!hasActiveOrCompletedItems) {
        container.innerHTML = `<div class="empty-state">No active project. Select items in the Calculator and click "Start Project" to generate your checklist.</div>`;
        return;
    }

    const groupedMats = {};
    Object.entries(matTotals).forEach(([mat, total]) => {
        const category = getCategoryForMaterial(mat);
        if (!groupedMats[category]) groupedMats[category] = [];
        groupedMats[category].push({ name: mat, total });
    });

    let html = ``;

    for (const [category, mats] of Object.entries(groupedMats)) {
        html += `<div class="checklist-section">
                    <div class="checklist-header" onclick="toggleChecklistSection(this)">
                        <span>📌 ${category}</span>
                    </div>`;
        mats.forEach(m => {
            const checkId = `mat_${m.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const isChecked = checklistProgress[checkId] ? "completed" : "";
            html += `
                <div class="check-item ${isChecked}" onclick="toggleCheckItem('${checkId}', this)">
                    <div class="checkbox"></div>
                    <div class="check-text">${m.name}</div>
                    <div class="check-qty" id="qty_${checkId}">x${m.total.toLocaleString()}</div>
                </div>`;
        });
        html += `</div>`;
    }

    let hasFurniture = false;
    let hasCompletedFurniture = false;
    let furnitureActiveHtml = ``;
    let furnitureCompletedHtml = ``;

    items.forEach(item => {
        const qty = quantities[item.id] || 0;
        if (qty > 0) hasFurniture = true;
        for (let i = 0; i < qty; i++) {
            furnitureActiveHtml += `
                <div class="check-item" onclick="completeCraft('${item.id}', this)">
                    <div class="checkbox"></div>
                    <div class="check-text">${item.name}</div>
                    <div class="check-qty" style="background: rgba(232, 195, 64, 0.15); color: var(--accent-gold);">⏱️ ${formatTime(item.timeMinutes)}</div>
                </div>`;
        }
        
        const compQty = completedCrafts[item.id] || 0;
        if (compQty > 0) hasCompletedFurniture = true;
        for (let i = 0; i < compQty; i++) {
            furnitureCompletedHtml += `
                <div class="check-item completed" onclick="undoCraft('${item.id}')">
                    <div class="checkbox"></div>
                    <div class="check-text">${item.name}</div>
                    <div class="check-qty" style="background: rgba(232, 195, 64, 0.15); color: var(--accent-gold);">⏱️ ${formatTime(item.timeMinutes)}</div>
                </div>`;
        }
    });

    if (hasFurniture || hasCompletedFurniture) {
        html += `<div class="checklist-section" style="margin-top: 32px;">
                    <div class="checklist-header" onclick="toggleChecklistSection(this)">
                        <span>🔨 Furniture Assembly</span>
                    </div>
                    ${furnitureActiveHtml}`;
                    
        if (hasCompletedFurniture) {
            html += `<div class="completed-toggle" onclick="toggleCompletedVisibility('furniture')">
                        ${showCompleted.furniture ? 'Hide' : 'Show'} Completed Furniture
                     </div>
                     <div class="completed-container" style="display: ${showCompleted.furniture ? 'block' : 'none'};">
                        ${furnitureCompletedHtml}
                     </div>`;
        }
        html += `</div>`;
    }

    let hasPets = false;
    let hasCompletedPets = false;
    let petsActiveHtml = ``;
    let petsCompletedHtml = ``;

    pets.forEach(pet => {
        const qty = quantities[pet.id] || 0;
        if (qty > 0) hasPets = true;
        for (let i = 0; i < qty; i++) {
            petsActiveHtml += `
                <div class="check-item" onclick="completeCraft('${pet.id}', this)">
                    <div class="checkbox"></div>
                    <div class="check-text">${pet.name}</div>
                    <div class="check-qty" style="background: rgba(50, 168, 115, 0.15); color: var(--accent-pet);">⏱️ ${formatTime(pet.timeMinutes)}</div>
                </div>`;
        }
        
        const compQty = completedCrafts[pet.id] || 0;
        if (compQty > 0) hasCompletedPets = true;
        for (let i = 0; i < compQty; i++) {
            petsCompletedHtml += `
                <div class="check-item completed" onclick="undoCraft('${pet.id}')">
                    <div class="checkbox"></div>
                    <div class="check-text">${pet.name}</div>
                    <div class="check-qty" style="background: rgba(50, 168, 115, 0.15); color: var(--accent-pet);">⏱️ ${formatTime(pet.timeMinutes)}</div>
                </div>`;
        }
    });

    if (hasPets || hasCompletedPets) {
        html += `<div class="checklist-section" style="margin-top: 32px;">
                    <div class="checklist-header" onclick="toggleChecklistSection(this)">
                        <span style="color: var(--accent-pet);">🐾 Pet & Divine Beast Incubator</span>
                    </div>
                    ${petsActiveHtml}`;
                    
        if (hasCompletedPets) {
            html += `<div class="completed-toggle" onclick="toggleCompletedVisibility('pets')">
                        ${showCompleted.pets ? 'Hide' : 'Show'} Completed Pets & Beasts
                     </div>
                     <div class="completed-container" style="display: ${showCompleted.pets ? 'block' : 'none'};">
                        ${petsCompletedHtml}
                     </div>`;
        }
        html += `</div>`;
    }

    container.innerHTML = html;

    container.querySelectorAll('.checklist-section').forEach(section => {
        const checkItems = section.querySelectorAll('.check-item');
        if (checkItems.length > 0 && !section.querySelector('.completed-toggle')) {
            const allCompleted = Array.from(checkItems).every(item => item.classList.contains('completed'));
            if (allCompleted) {
                section.classList.add('collapsed');
            }
        }
    });
}

function updateQty(id, change) {
    quantities[id] = Math.max(0, (quantities[id] || 0) + change);
    saveQuantities();
    renderGrid();
    
    if (Object.values(quantities).some(q => q > 0) || Object.values(completedCrafts).some(q => q > 0)) {
        renderChecklist(); 
    } else {
        document.getElementById("checklistContainer").innerHTML = `<div class="empty-state">No active project. Select items in the Calculator and click "Start Project" to generate your checklist.</div>`;
    }
    
    calculateTotals();
}

function resetQuantities() {
    Object.keys(quantities).forEach(id => quantities[id] = 0);
    Object.keys(completedCrafts).forEach(id => completedCrafts[id] = 0);
    checklistProgress = {};
    showCompleted = { furniture: false, pets: false };
    
    saveQuantities();
    saveCompleted();
    saveChecklist();
    
    renderGrid();
    renderChecklist();
    calculateTotals();
}

function calculateTotals() {
    const matTotals = {};
    const taskDurations = [];
    let activeItemCount = 0;

    const allCraftables = [...items, ...pets];

    allCraftables.forEach(item => {
        const activeQty = quantities[item.id] || 0;
        if (activeQty > 0) {
            activeItemCount += activeQty;
            
            Object.entries(item.mats).forEach(([mat, count]) => {
                matTotals[mat] = (matTotals[mat] || 0) + (count * activeQty);
            });

            for (let i = 0; i < activeQty; i++) {
                taskDurations.push(item.timeMinutes);
            }
        }
    });

    const matsGridEl = document.getElementById("materialsGrid");
    matsGridEl.innerHTML = "";

    const sortedMats = Object.entries(matTotals).sort((a, b) => b[1] - a[1]);

    if (sortedMats.length === 0) {
        matsGridEl.innerHTML = `
            <div class="mat-tile">
                <span class="tile-title">Select Items</span>
                <span class="tile-count">0</span>
            </div>`;
    } else {
        sortedMats.forEach(([mat, currentReq]) => {
            const matCheckId = `mat_${mat.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const isChecked = checklistProgress[matCheckId];
            
            const tile = document.createElement("div");
            tile.className = "mat-tile";
            
            if (currentReq === 0 || isChecked) {
                tile.style.opacity = "0.5";
                tile.style.borderColor = "rgba(232, 195, 64, 0.3)";
            }

            tile.innerHTML = `
                <span class="tile-title">${mat}</span>
                <span class="tile-count">${currentReq.toLocaleString()}</span>`;
            matsGridEl.appendChild(tile);

            const checklistQtyEl = document.getElementById(`qty_${matCheckId}`);
            if (checklistQtyEl) {
                checklistQtyEl.innerHTML = `x${currentReq.toLocaleString()}`;
            }
        });
    }

    const totalParallelTime = calculateParallelTime(taskDurations, 4);
    document.getElementById("totalTimeDisplay").innerText = `⏱️ ${formatTime(totalParallelTime)} | ${activeItemCount} Active Items`;
}

function calculateParallelTime(durations, maxSlots) {
    if (durations.length === 0) return 0;
    durations.sort((a, b) => b - a);
    const slots = new Array(maxSlots).fill(0);

    durations.forEach(duration => {
        let earliestSlot = 0;
        for (let i = 1; i < maxSlots; i++) {
            if (slots[i] < slots[earliestSlot]) {
                earliestSlot = i;
            }
        }
        slots[earliestSlot] += duration;
    });

    return Math.max(...slots);
}
